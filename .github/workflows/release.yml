name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 1.0.0)"
        required: true

permissions:
  contents: read
  # Push the image and the chart to GHCR.
  packages: write
  # buildx provenance attestation.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # arm64 is free on public repositories, via the native ubuntu-24.04-arm
          # runner. Add it as `linux/amd64,linux/arm64` with a matrix when a reason
          # appears; the cluster is amd64 today.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install helm
        run: |
          scripts/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Package the chart
        run: |
          version="${{ inputs.version || github.ref_name }}"
          helm package charts/town --version "${version#v}" --app-version "${version#v}" --destination dist/chart

      - name: Push the chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
          helm push dist/chart/town-*.tgz "oci://$REGISTRY/${{ github.repository_owner }}/charts"

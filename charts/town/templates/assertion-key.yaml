{{- if .Values.assertion.create }}
{{- $name := include "town.assertionSecretName" . }}
{{- $existing := lookup "v1" "Secret" (include "town.namespace" .) $name }}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "town.namespace" . }}
  labels:
    {{- include "town.labels" . | nindent 4 }}
  annotations:
    # Keep on uninstall. Replacing this key without also replacing pestilence's
    # public key stops every request until the pair is regenerated.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  assertion-key.pem: {{ required "assertion.privateKey is required when assertion.create is true and the secret does not exist. Run cluster-setup-scripts/generate-keys.sh." .Values.assertion.privateKey | quote }}
{{- end }}
{{- end }}

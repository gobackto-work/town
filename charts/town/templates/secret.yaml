{{- if .Values.secrets.github.create }}
{{- $name := include "town.secretName" . }}
{{- $existing := lookup "v1" "Secret" (include "town.namespace" .) $name }}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "town.namespace" . }}
  labels:
    {{- include "town.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  GITHUB_CLIENT_SECRET: {{ required "secrets.github.clientSecret is required when secrets.github.create is true and the secret does not exist" .Values.secrets.github.clientSecret | quote }}
  SESSION_SECRET: {{ default (randAlphaNum 48) .Values.secrets.github.sessionSecret | quote }}
{{- end }}
{{- end }}
